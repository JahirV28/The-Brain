function makeShellMaterial(color, gain) {
  return new THREE.ShaderMaterial({
    uniforms: {
      uColor: { value: new THREE.Color(color) }, uTint: { value: new THREE.Color('#ffffff') },
      uTintAmt: { value: 0 }, uPulse: { value: 0 }, uGain: { value: gain || 1 }, uTime: timeU

    vertexShader: shellVS,
    fragmentShader: `
      uniform vec3 uColor; uniform vec3 uTint; uniform float uTintAmt; uniform float uPulse; uniform float uGain; uniform float uTime;
      varying vec3 vN; varying vec3 vV; varying vec3 vP;
      void main(){
        float f = 1.0 - abs(dot(normalize(vN), normalize(vV)));
        float rim = pow(f, 2.4);
        float scan = smoothstep(0.965, 1.0, sin(vP.y * 5.0 - uTime * 0.8)) * 0.10;
        vec3 base = mix(uColor, uTint, uTintAmt);
        vec3 col = base * (rim * 0.42 + 0.014 + scan * 0.6) * (1.0 + uPulse * 1.1);
        col += uTint * uPulse * 0.035;
        gl_FragColor = vec4(col * uGain, 1.0);
      }`,
    transparent: true, depthWrite: false, side: THREE.DoubleSide, blending: THREE.AdditiveBlending
  });
}

function makeGlowMaterial(color, grad) {

    uniforms: { uColor: { value: new THREE.Color(color) }, uIntensity: { value: 1 }, uGrad: { value: grad ? 1 : 0 }, uTime: timeU },
    vertexShader: `
      varying vec3 vN; varying vec3 vV; varying vec2 vUv;
      void main(){ vUv = uv; vec4 mv = modelViewMatrix * vec4(position, 1.0);
        vN = normalize(normalMatrix * normal); vV = normalize(-mv.xyz); gl_Position = projectionMatrix * mv; }`,
    fragmentShader: `
      uniform vec3 uColor; uniform float uIntensity; uniform float uGrad; uniform float uTime;
      varying vec3 vN; varying vec3 vV; varying vec2 vUv;
      void main(){
        float f = 1.0 - abs(dot(normalize(vN), normalize(vV)));
        float rim = pow(f, 2.0);
        float g = mix(1.0, 1.0 - 0.6 * smoothstep(0.35, 0.85, vUv.x), uGrad);
        float inten = 1.2 * (1.0 - exp(-uIntensity * g * 1.1));
        vec3 col = uColor * (0.32 + 0.55 * rim) * (0.12 + inten * 0.95) + uColor * rim * 0.12 * inten;
        float a = clamp(0.4 + 0.6 * rim, 0.0, 1.0) * clamp(0.2 + 0.8 * inten, 0.0, 1.0);

    transparent: true, depthWrite: false

function makeTractMaterial(cA, cB) {

function hash3(x, y, z) {
  let h = Math.imul(x, 374761393) ^ Math.imul(y, 668265263) ^ Math.imul(z, 1274126177);
  h = Math.imul(h ^ (h >>> 13), 1274126177); h ^= h >>> 16;
  return (h >>> 0) / 4294967295;
}
function vnoise(x, y, z) {
  const xi = Math.floor(x), yi = Math.floor(y), zi = Math.floor(z);
  const xf = x - xi, yf = y - yi, zf = z - zi;
  const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf), w = zf * zf * (3 - 2 * zf);
  const l = (a, b, t) => a + (b - a) * t;
  return l(
    l(l(hash3(xi, yi, zi), hash3(xi + 1, yi, zi), u), l(hash3(xi, yi + 1, zi), hash3(xi + 1, yi + 1, zi), u), v),
    l(l(hash3(xi, yi, zi + 1), hash3(xi + 1, yi, zi + 1), u), l(hash3(xi, yi + 1, zi + 1), hash3(xi + 1, yi + 1, zi + 1), u), v), w) * 2 - 1;
}
const TEMPORAL_DIR = V(0.92, -0.48, 0.12).normalize();
const MEDIAL_OFFSET = 0.19;

// d: unit direction on sphere (poles on ±z). Returns hemisphere-local point (lateral = +x).
function brainPoint(d, seed) {
  const n1 = vnoise(d.x * 3.1 + seed, d.y * 3.1 + seed * 0.7, d.z * 3.1 - seed);
  const n2 = vnoise(d.x * 6.4 - seed, d.y * 6.4 + seed, d.z * 6.4 + seed * 0.5);
  let r = 1 + 0.045 * Math.abs(n1) + 0.022 * Math.abs(n2);
  r += 0.17 * Math.exp(-d.distanceToSquared(TEMPORAL_DIR) / 0.16);                         // temporal lobe bulge
  const sylv = Math.exp(-Math.pow(d.y + 0.1 - 0.25 * d.z, 2) / 0.007) * sstep(0.35, 0.8, d.x) * sstep(-0.6, 0.1, d.z);
  r -= 0.075 * sylv;                                                                        // lateral (Sylvian) groove
  let x = d.x * r, y = d.y * r, z = d.z * r;
  x *= (0.12 + 0.88 * sstep(-0.45, 0.05, x));                                                // flatten medial wall
  const taper = 1 - 0.18 * sstep(0.15, 1, d.z) - 0.1 * sstep(0.3, 1, -d.z);
  x *= 1.25 * taper;
  y *= (y > 0 ? 1.2 : 0.72);
  z *= 1.75;
  return V(x, y, z);
}

function buildHemisphere(side, ws, hs, seed) {
  const g = new THREE.SphereGeometry(1, ws, hs);
  g.rotateX(Math.PI / 2);
  const p = g.attributes.position, d = new THREE.Vector3();
  for (let i = 0; i < p.count; i++) {
    d.fromBufferAttribute(p, i).normalize();
    const q = brainPoint(d, seed);
    p.setXYZ(i, side * (q.x + MEDIAL_OFFSET), q.y, q.z);
  }
  g.computeVertexNormals();
  // weld normals along the UV seam and poles so there is no visible line
  const n = g.attributes.normal, W = ws + 1, tmp = new THREE.Vector3();
  for (let iy = 0; iy <= hs; iy++) {
    if (iy === 0 || iy === hs) {
      tmp.set(0, 0, 0);
      for (let ix = 0; ix < W; ix++) tmp.add(V(n.getX(iy * W + ix), n.getY(iy * W + ix), n.getZ(iy * W + ix)));
      tmp.normalize();
      for (let ix = 0; ix < W; ix++) n.setXYZ(iy * W + ix, tmp.x, tmp.y, tmp.z);
    } else {
      const a = iy * W, b = iy * W + ws;
      tmp.set(n.getX(a) + n.getX(b), n.getY(a) + n.getY(b), n.getZ(a) + n.getZ(b)).normalize();
      n.setXYZ(a, tmp.x, tmp.y, tmp.z); n.setXYZ(b, tmp.x, tmp.y, tmp.z);
    }
  }
  return g;
}

function buildGridLines(side, ws, hs, seed) {
  const g = new THREE.SphereGeometry(1, ws, hs);
  g.rotateX(Math.PI / 2);
  const p = g.attributes.position, d = new THREE.Vector3(), W = ws + 1, pts = [];
  const P = [];
  for (let i = 0; i < p.count; i++) {
    d.fromBufferAttribute(p, i).normalize();
    const q = brainPoint(d, seed);
    P.push(V(side * (q.x + MEDIAL_OFFSET), q.y, q.z));
    // nudge slightly outward from hemisphere center to avoid z-fighting
    const c = V(side * MEDIAL_OFFSET, 0, 0); P[i].sub(c).multiplyScalar(1.004).add(c);
  }
  for (let iy = 1; iy < hs; iy++) for (let ix = 0; ix < ws; ix++) { const a = P[iy * W + ix], b = P[iy * W + ix + 1]; pts.push(a.x, a.y, a.z, b.x, b.y, b.z); }
  for (let iy = 0; iy < hs; iy++) for (let ix = 0; ix < ws; ix++) { const a = P[iy * W + ix], b = P[(iy + 1) * W + ix]; pts.push(a.x, a.y, a.z, b.x, b.y, b.z); }
  const lg = new THREE.BufferGeometry();
  lg.setAttribute('position', new THREE.Float32BufferAttribute(pts, 3));

}

    const r = R[def.id], sp = sim ? sim.reg[def.id] : null;
    const active = f === 'all' || def.parts.includes(f);
    let tgt = sp ? sp.i : (active ? (f === 'all' ? 0.85 : 1.0) : 0.13);
    if (state.selected) {
      if (sim) tgt = (def.id === state.selected) ? tgt + 0.3 : tgt * 0.9;
      else tgt = (def.id === state.selected) ? Math.max(tgt, 1.0) + 0.35 : tgt * 0.72;
    }
    if (state.hover === def.id) tgt += 0.3;
    r.intensity += (tgt - r.intensity) * k;
    let sc = 1 + 0.025 * Math.sin(time * 1.6 + r.phase), inten = r.intensity;
    if (sp) {
      if (sp.pa) sc += sp.pa * Math.sin(time * TAU * sp.pf) * (sim.id === 'hijack' ? 1 : 1);
      if (sp.ia) inten *= 1 + sp.ia * Math.sin(time * TAU * sp.pf);
    }
    r.mats.forEach(m => m.uniforms.uIntensity.value = inten);
    r.holders.forEach(h => h.scale.setScalar(sc));
    const hOp = clamp(0.04 + inten * 0.13, 0, 0.3);
    r.halos.forEach(h => { h.material.opacity = hOp; h.scale.setScalar(h.userData.s * (0.75 + 0.3 * inten)); });
    const wOp = clamp(inten * 0.32, 0.04, 0.75); r.wires.forEach(w => w.opacity = wOp);
  });
}

function updateTracts(dt, time) {
  const sim = SIMS.find(s => s.id === state.sim), f = state.filter, k = Math.min(1, dt * 4);
  tracts.forEach(tr => {
    const A = R[tr.a], B = R[tr.b];
    let tb, ts, tt, ca = A.col, cb = B.col;
    if (sim) {
      const fx = sim.tract(tr); tb = fx.bright; ts = fx.speed; tt = fx.thick * (1 + (fx.tp || 0) * Math.sin(time * 2.4 + tr.base * 20));
      if (fx.ca) { colTmpA.set(fx.ca); ca = colTmpA; } if (fx.cb) { colTmpB.set(fx.cb); cb = colTmpB; }
    } else {
      const aa = f === 'all' || A.parts.includes(f), ab = f === 'all' || B.parts.includes(f);
      tb = f === 'all' ? 0.65 : (aa && ab ? 1.0 : (aa || ab ? 0.25 : 0.08)); ts = 1; tt = 1;
    }
    if (state.selected) { const touch = has(tr, state.selected); tb *= touch ? 1.7 : 0.55; if (touch) tt *= 1.5; }
    tr.bright += (tb - tr.bright) * k; tr.speed += (ts - tr.speed) * k; tr.thick += (tt - tr.thick) * k;
    tr.cA.lerp(ca, k); tr.cB.lerp(cb, k);
    tr.phase += dt * tr.base * tr.speed;
    const u = tr.mat.uniforms; u.uPhase.value = tr.phase * 3.2; u.uBright.value = tr.bright; u.uThick.value = tr.thick;
    u.uColA.value.copy(tr.cA); u.uColB.value.copy(tr.cB);
  });
}

function updateShellAndFx(dt, time) {
  const sim = SIMS.find(s => s.id === state.sim), k = Math.min(1, dt * 3);
  const tgtAmt = sim ? sim.tint.amt : 0;
  tintAmt += (tgtAmt - tintAmt) * k;
  let wave = 0.5 + 0.5 * Math.sin(time * TAU * (sim ? sim.tint.hz : 1));
  if (sim) {
    if (sim.id === 'hijack') wave = Math.pow(wave, 3);
    colTmpA.set(sim.tint.c1); colTmpB.set(sim.tint.c2);
    tintCol.copy(colTmpA).lerp(colTmpB, 0.5 + 0.5 * Math.sin(time * 1.7));
  }
  shellMats.forEach(m => {
    m.uniforms.uTint.value.copy(tintCol);
    m.uniforms.uTintAmt.value = tintAmt * (0.4 + 0.6 * wave);
    m.uniforms.uPulse.value = tintAmt * wave * 0.6;
  });
  const fxT = sim ? sim.fx.amt : 0; fxAmt += (fxT - fxAmt) * k;
  let fw = sim ? 0.5 + 0.5 * Math.sin(time * TAU * sim.fx.hz) : 0; if (sim && sim.id === 'hijack') fw = Math.pow(fw, 2);
  fxEl.style.opacity = (fxAmt * (0.45 + 0.55 * fw)).toFixed(3);
}

function updateWaves(dt) {
  const sim = SIMS.find(s => s.id === state.sim);
  if (sim) {
    simTimer += dt;
    if (simTimer >= sim.waves.period) {
      simTimer = 0; const w = sim.waves, col = w.colors[simWaveIdx % w.colors.length]; simWaveIdx++;
      if (w.origin === 'amyg') spawnWave(R.amyg.anchorFn(0, simWaveIdx % 2 ? 1 : -1), col, w.speed, w.rmax, w.scale);
      else if (typeof w.origin === 'string') spawnWave(R[w.origin].anchorFn(0.5, camera.position.x >= 0 ? 1 : -1), col, w.speed, w.rmax, w.scale);
      else spawnWave(w.origin, col, w.speed, w.rmax, w.scale);
    }
  }
  waves.forEach(w => {
    if (!w.active) return;
    w.age += dt; const r = w.age * w.speed, t = w.age / w.life;
    if (t >= 1) { w.active = false; w.mesh.visible = false; return; }
    w.mesh.scale.set(r * w.sc[0], r * w.sc[1], r * w.sc[2]);
    w.mat.uniforms.uAlpha.value = Math.pow(1 - t, 1.6) * 0.55;
  });
}

const _lp = new THREE.Vector3();
function updateLabels() {
  const W = window.innerWidth, H = window.innerHeight; camera.updateMatrixWorld();
  REGIONS.forEach(def => {
    const r = R[def.id];
    let best = null, bd = 1e9;
    r.labelPts.forEach(p => { _lp.copy(p).applyMatrix4(brainGroup.matrixWorld); const d = _lp.distanceTo(camera.position); if (d < bd) { bd = d; best = p; } });
    _lp.copy(best).applyMatrix4(brainGroup.matrixWorld).project(camera);
    const vis = _lp.z < 1, sx = (_lp.x * 0.5 + 0.5) * W, sy = (-_lp.y * 0.5 + 0.5) * H;
    r.markerEl.style.transform = `translate(${sx}px,${sy}px)`; r.markerEl.style.display = vis ? 'block' : 'none';
    const show = vis && (state.selected === def.id || state.hover === def.id);
    r.labelEl.classList.toggle('on', show); r.lineEl.classList.toggle('on', show);
    if (show) {
      const rem = parseFloat(getComputedStyle(document.documentElement).fontSize), pw = r.labelEl.offsetWidth + 2 * rem;
      const lim0 = 26.5 * rem, lim1 = W - 38.5 * rem, gap = 5.5 * rem;
      let dirx = sx < W * 0.5 ? -1 : 1;
      if (dirx > 0 && sx + gap + pw > lim1) dirx = -1;
      if (dirx < 0 && sx - gap - pw < lim0) dirx = 1;
      const ox = sx + dirx * gap, oy = sy - 4.2 * rem;
      r.labelEl.style.transform = `translate(${ox}px,${oy}px) translate(${dirx < 0 ? '-100%' : '0'},-50%)`;
      r.lineEl.setAttribute('x1', sx); r.lineEl.setAttribute('y1', sy); r.lineEl.setAttribute('x2', ox); r.lineEl.setAttribute('y2', oy);
    }
  });
}

/* =====================================================================
   12. RESIZE + LOOP
===================================================================== */
function onResize() {
  const w = window.innerWidth, h = window.innerHeight;
  camera.aspect = w / h; camera.updateProjectionMatrix();
  renderer.setSize(w, h); if (composer) composer.setSize(w, h);
  pMat.uniforms.uScale.value = (h * renderer.getPixelRatio()) / (2 * Math.tan(THREE.MathUtils.degToRad(camera.fov) / 2));
}
window.addEventListener('resize', onResize); onResize();

const clock = new THREE.Clock(); let time = 0, first = true;
function frame() {
  requestAnimationFrame(frame);
  const dt = Math.min(clock.getDelta(), 0.05); time += dt; timeU.value = time;
  updateTween(dt); controls.update();
  updateRegions(dt, time); updateTracts(dt, time); updateParticles(); updateShellAndFx(dt, time); updateWaves(dt);
  dust.rotation.y += dt * 0.01;
  updateLabels();
  if (composer) composer.render(); else renderer.render(scene, camera);
  if (first) { first = false; setTimeout(() => $('loading').classList.add('done'), 400); }
}

// Initial state
refreshUI(); renderCard();
flyTo(HOME.t, HOME.dir, HOME.r, 2.6);
frame();

// Handy hooks for rehearsal / testing
window.brainApp = { select, deselect, setFilter, toggleSim, resetCamera, state };
})();
</script>
